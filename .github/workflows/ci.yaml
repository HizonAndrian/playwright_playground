name: Playwright # Workflow name
on:
  [workflow_dispatch, push] # Workflow triggers

jobs:
  test: # Job Name
    runs-on: ubuntu-latest # Runner environment
    steps:
      - name: Checkout repository / Get Code
        uses: actions/checkout@v3

      # - name: Python setup
      #   uses: actions/setup-python@v4
      #   with:
      #     python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install

      - name: Install browser dependencies
        run: |
          python -m playwright install-deps

      - name: Run Pytest
        run: |
          pytest

  deploy: # Job Name
    runs-on: ubuntu-latest # Runner environment
    needs: test # This job will run after the 'test' job is successful
    steps:
